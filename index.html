<!DOCTYPE html>
<!-- إصدار الملف: 1.51 -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="التحول الكيميائي">
<meta name="theme-color" content="#1c232b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>التحول الكيميائي</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #dde6ec 0%, #c5d0d8 100%);
    touch-action: none;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
  }
  #tabBar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 46px;
    display: flex;
    background: #1c232b;
    z-index: 50;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .tabBtn {
    flex: 1;
    border: none;
    color: #cfd6dc;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    border-radius: 12px 12px 0 0;
    margin: 5px 3px 0;
    transition: background .2s, color .2s;
  }
  .tabBtn[data-tab="tab1"] { background: #3d2b63; }
  .tabBtn[data-tab="tab1"].active {
    color: #ffffff;
    background: #7b4fd1;
    border-bottom-color: #b79bf0;
  }
  .tabBtn[data-tab="tab2"] { background: #5c4110; }
  .tabBtn[data-tab="tab2"].active {
    color: #ffffff;
    background: #c98a1c;
    border-bottom-color: #ffcf70;
  }
  .tabPanel {
    display: none;
    position: fixed;
    top: 46px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .tabPanel.active { display: block; }
  #tab1.active { display: flex; flex-direction: column; }
  #sceneSwitch {
    flex: 0 0 44px;
    display: flex;
    background: #dde2e8;
    border-bottom: none;
    z-index: 30;
    align-items: flex-end;
    padding: 0 8px;
    gap: 5px;
  }
  .sceneBtn {
    flex: 1;
    border: none;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    padding: 5px 4px 6px;
    color: rgba(255,255,255,0.88);
    font-weight: 500;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.13);
    transition: padding-top 0.15s;
  }
  .sceneBtn[data-scene="charcoal"]              { background: #a93226; }
  .sceneBtn[data-scene="charcoal"].active       { background: #e74c3c; color:#fff; font-weight:bold; padding-top:8px; }
  .sceneBtn[data-scene="electrolysis"]          { background: #1565c0; }
  .sceneBtn[data-scene="electrolysis"].active   { background: #1e88e5; color:#fff; font-weight:bold; padding-top:8px; }
  .sceneBtn[data-scene="methane"]               { background: #006064; }
  .sceneBtn[data-scene="methane"].active        { background: #00897b; color:#fff; font-weight:bold; padding-top:8px; }
  #instructionBar {
    flex: 0 0 auto;
    background: transparent;
    padding: 5px 14px 6px;
    text-align: center;
    direction: rtl;
  }
  #instructionText {
    display: block;
    font-size: 13px;
    color: #3a4550;
    line-height: 1.4;
  }
  #lensHint {
    display: block;
    font-size: 11.5px;
    color: #c05800;
    font-style: italic;
    margin-top: 2px;
  }
  #viewport {
    width: 100%;
    height: 100%;
    flex: 1;
    overflow: hidden;
    touch-action: none;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: block;
    transform-origin: 0 0;
  }

  .lid-group {
    cursor: grab;
  }
  .lid-group:active {
    cursor: grabbing;
  }

  /* ===== اللسان الثاني: التعبير عن التحول الكيميائي ===== */
  #tab2 {
    direction: rtl;
    overflow-y: auto;
    padding: 22px 18px 60px;
    box-sizing: border-box;
    background: #f4f6f8;
    color: #2a323b;
  }
  #tab2Empty {
    text-align: center;
    color: #6b7580;
    font-size: 15px;
    margin-top: 60px;
    line-height: 1.9;
  }
  .reactionBoard h2 {
    font-size: 19px;
    margin: 0 0 16px;
    color: #1c232b;
  }
  .molTable {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 24px;
  }
  .molTable th, .molTable td {
    border: 1px solid #dfe4e8;
    padding: 10px 6px;
    text-align: center;
  }
  .molTable th {
    background: #eef2f5;
    font-size: 13px;
    color: #4a5560;
    font-weight: normal;
  }
  .molTable td:empty { background: #fbfcfd; }
  .molChip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity .2s, filter .2s;
  }
  .molChip .chipFormula { font-weight: bold; font-size: 14px; direction: ltr; }
  .molChip.depleted {
    opacity: .35;
    filter: grayscale(1);
    cursor: default;
    pointer-events: none;
  }
  .dragGhost {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dragGhost svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }

  /* إطار التعبير بالنماذج الجزيئية — وجهة السحب (بلا حدود افتراضيًا، كالإطار الأصلي) */
  .modelFrame {
    direction: ltr;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border-radius: 10px;
    padding: 20px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 6px;
    flex-wrap: nowrap;
  }
  .modelZone {
    flex: 1;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 10px 6px;
    transition: background .15s, border-color .15s;
  }
  .modelZone.dragOver { background: #fff4ea; border-color: #ff8a3d; }
  .modelZone.errorFlash {
    animation: eqZoneShake .4s;
    border-color: #d64545 !important;
    background: #fdeaea !important;
  }
  @keyframes eqZoneShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .modelSlot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .eqPlus { font-size: clamp(14px, 4.2vw, 18px); color: #8a939c; padding: 0 2px; }
  .modelPlus { font-size: 18px; color: #8a939c; padding: 0 2px; }
  .modelIcon { display: inline-flex; width: 30px; height: 30px; }
  .modelIcon svg { width: 100%; height: 100%; }

  /* إطار التعبير بالرموز والصيغ — عرض تلقائي فقط */
  .eqFrame {
    direction: ltr;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #fff;
    border-radius: 10px;
    padding: 18px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 10px;
    flex-wrap: wrap;
    max-width: 100%;
    box-sizing: border-box;
  }
  .eqZone {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 4px;
    min-width: 0;
  }
  .eqSlot { font-size: clamp(14px, 4.6vw, 20px); color: #1c232b; white-space: nowrap; }
  .eqSlot.empty { color: #b7bec4; }
  .eqArrow { font-size: clamp(18px, 5.5vw, 26px); line-height: 1; color: #ff8a3d; flex: 0 0 auto; }
  .stateSym { font-size: 0.55em; color: #8a939c; }
  .boardHint {
    text-align: center;
    font-size: 12px;
    color: #8a939c;
    margin-bottom: 22px;
  }

    /* ===== بطاقة توازن المعادلة ===== */
    .balanceInfo {
      margin: 10px 0 4px;
      padding: 10px 14px 11px;
      background: #eef8f0;
      border: 1.5px solid #5bb37a;
      border-radius: 10px;
      text-align: center;
      animation: fadeInBalance 0.4s ease;
    }
    @keyframes fadeInBalance {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .balanceTitle {
      font-size: clamp(12px, 3.5vw, 15px);
      font-weight: 700;
      color: #27865a;
      margin-bottom: 8px;
    }
    .atomsRow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .atomsSide {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: clamp(11px, 3.2vw, 14px);
      line-height: 1.5;
    }
    .reactSide  { background: #ddf0ff; border: 1px solid #90caf9; color: #1a4f80; }
    .prodSide   { background: #fff3dc; border: 1px solid #f5c97a; color: #7a4a00; }
    .sideLabel  { font-weight: 700; margin-left: 4px; }
    .atomBadge  {
      display: inline-block;
      background: rgba(255,255,255,0.7);
      border-radius: 5px;
      padding: 1px 5px;
      margin: 1px 2px;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 600;
    }
    .atomEq { font-size: 1.3em; font-weight: 700; color: #27865a; margin: 0 2px; }
  </style>
</head>
<body>
<div id="tabBar">
  <button class="tabBtn active" data-tab="tab1">التحول الكيميائي</button>
  <button class="tabBtn" data-tab="tab2">التعبير عن التحول الكيميائي</button>
</div>

<div id="tab1" class="tabPanel active">
  <div id="sceneSwitch">
    <button class="sceneBtn active" data-scene="charcoal">احتراق الفحم</button>
    <button class="sceneBtn" data-scene="electrolysis">التحليل الكهربائي</button>
    <button class="sceneBtn" data-scene="methane">احتراق الميثان</button>
  </div>
  <div id="instructionBar">
    <span id="instructionText">اسحب قطعة الفحم إلى داخل الجرة لبدء الاحتراق</span>
    <span id="lensHint">🔍 انقر على قطعة الفحم المشتعلة لفتح العدسة المجهرية</span>
  </div>
  <div id="viewport">
<svg id="stage" viewBox="0 -450 800 1450" preserveAspectRatio="xMidYMax meet">
  <defs>
    <!-- الأرضية الصلبة (خشب) -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a9754a"/>
      <stop offset="55%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#5b3a20"/>
    </linearGradient>

    <!-- الغطاء المعدني -->
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eef1f3"/>
      <stop offset="45%"  stop-color="#a2aab1"/>
      <stop offset="100%" stop-color="#4c525a"/>
    </linearGradient>

    <!-- السلك المعدني -->
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d434a"/>
      <stop offset="50%"  stop-color="#b7bec4"/>
      <stop offset="100%" stop-color="#3d434a"/>
    </linearGradient>

    <!-- توهج قطعة الفحم -->
    <radialGradient id="charcoalCore" cx="50%" cy="42%" r="62%">
      <stop id="coreStop1" offset="0%"   stop-color="#a8340f"/>
      <stop id="coreStop2" offset="62%"  stop-color="#a8340f"/>
      <stop id="coreStop3" offset="100%" stop-color="#3a1006"/>
    </radialGradient>

    <filter id="softBlur" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glowBlur" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- يمنع رسم أي جزء من صورة الجرة أسفل خط السطح الصلب -->
    <clipPath id="aboveGround">
      <rect x="0" y="0" width="800" height="900"/>
    </clipPath>
  </defs>

  <!-- ============ مشهد احتراق الفحم ============ -->
  <g id="sceneCharcoal">
  <!-- ظل الجرة على السطح -->
  <ellipse cx="400" cy="904" rx="190" ry="20" fill="url(#shadowGrad)"/>

  <!-- ============ الجرة: صورة حقيقية، محاذاة بدقة على شبكة المشهد ============ -->
